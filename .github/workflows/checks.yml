name: checks
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -s sh second-wind/scripts/*.sh install.sh
      - name: python compiles
        run: python3 -m compileall -q second-wind/scripts
      - name: no personal data
        run: |
          if grep -rniE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' \
               --exclude-dir=.git --exclude=LICENSE . \
             | grep -viE 'example\.com|anthropic\.com/legal|openai\.com/policies'; then
            echo "personal data found"; exit 1
          fi
