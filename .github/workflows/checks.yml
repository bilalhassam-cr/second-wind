name: checks
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -s sh second-wind/scripts/*.sh install.sh
      - name: python compiles
        run: python3 -m compileall -q second-wind/scripts
      - name: unit tests
        run: python3 -m unittest discover -s second-wind/tests
      - name: no personal data
        run: |
          # An email address is not the only way personal data leaks into a public
          # repo. A home directory path names the author just as clearly, and so
          # does a machine name left in an example.
          fail=0
          # user@example.com is the address the reader fixtures use, so it stays
          # allowed. Removing that exclusion breaks the fixtures, not the policy.
          if grep -rniE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' \
               --exclude-dir=.git --exclude=LICENSE . \
             | grep -viE 'example\.com|anthropic\.com/legal|openai\.com/policies'; then
            echo "email address found"; fail=1
          fi
          # a real home directory, rather than ~ or $HOME
          if grep -rnE '/(Users|home)/[A-Za-z0-9._-]+' \
               --exclude-dir=.git --exclude=LICENSE . \
             | grep -viE '/Users/<|/home/<|youruser|yourname|/Users/you/|/Users/example/'; then
            echo "absolute home path found; use ~ or \$HOME"; fail=1
          fi
          # Names that once appeared in an example label and must not come back.
          # A placeholder such as "Work Claude" carries the same meaning without
          # naming anyone. Add to this list, do not edit an entry out of it.
          # This file is excluded because it has to spell the words out to look
          # for them, and would otherwise match itself.
          # The repository's own GitHub address carries the owner's handle and
          # is the one place that name is allowed to appear.
          if grep -rniE 'clearoute|humaniti|bilal' \
               --exclude-dir=.git --exclude=checks.yml . \
             | grep -v 'github.com/bilalhassam-cr/second-wind'; then
            echo "author or employer name found; use a neutral placeholder"; fail=1
          fi
          # An em dash is easy to reintroduce in prose and violates the public
          # writing convention even though it is not personal data.
          emdash=$(printf '\342\200\224')
          if grep -rn "$emdash" --exclude-dir=.git .; then
            echo "em dash found; use British punctuation without em dashes"; fail=1
          fi
          exit $fail
